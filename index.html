/* additions: pieces the supplied stylesheet does not cover */
:root{color-scheme:light}
html{scroll-behavior:smooth}
.backup button,.backup .text-button{margin:0;display:inline-flex;align-items:center;gap:7px;color:#864d6b;font-size:12px}
.backup{margin-top:10px}
.sidebar nav button{width:100%}
@media(min-width:761px){.mobile-tools{display:none}}
.topbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .sound-toggle,.topbar .secondary{display:inline-flex;align-items:center;gap:7px}
.subtabs{overflow-x:auto;scrollbar-width:none}
.subtabs button{white-space:nowrap}
.task-row.is-na .task-toggle{opacity:.5}
.task-row .task-toggle{min-width:0;flex:1}
.water-buttons{flex-wrap:wrap}
.water-buttons button{flex:1 1 calc(25% - 8px);min-width:0}
.water-buttons button:disabled{opacity:.6}
.legend span:first-child i{background:#c68eaf}
.legend span:nth-child(2) i{background:#ecd7e6}
.chart-day{cursor:pointer}
.chart-day.today small{color:#74435c;font-weight:700}
.calendar-strip button{flex-shrink:0}
.calendar-strip .future:not(.current) b{opacity:.7}
input[type=time]{direction:ltr;text-align:center;font-family:Tajawal,sans-serif}
.number-field input[type=time]{font-size:18px}
.number-field>span{display:block}
.modal{width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto}
.modal .field-label input,.modal .field-label textarea{margin-top:8px}
.modal textarea{line-height:1.5;font-size:12px}
.quote{font-weight:500}
.future-note{margin-bottom:18px}
.storage-warn{margin-bottom:0}
.ai-status{font-size:12px;color:#86556d;margin-top:10px;line-height:1.8}
.nutrition-total .ai-button{flex-shrink:0}
.estimate .secondary{margin-top:10px;padding:9px 12px;font-size:12px}
.pin-error{color:#a74c57;margin-top:12px;font-size:13px}
.lace-lock .text-button{display:inline-block}
.sleep-fields .number-field input{font-size:18px}
.workout-heading strong{font-size:15px}
.hero h1 span.when{color:#a06d88;font-weight:400;font-size:.72em;display:block}
.chart-card .chart{padding-bottom:2px}
.savebar .secondary{width:100%;padding:12px}
.mobile-tools button{display:inline-flex;align-items:center;gap:7px}
.session-check{text-align:center}
.checkbox svg{display:block}
.meal-box label{display:block;font-weight:700}
.empty-line{color:#94677e;font-size:13px;line-height:1.9}
.guide-steps{margin:0;padding-right:22px}
@media(max-width:760px){
  .content{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .subtabs{gap:14px}
  .water-buttons button{padding:12px 6px}
  .monthly-head{flex-wrap:wrap}
  .topbar-tools{width:100%;justify-content:space-between}
  .nutrition-total .ai-button{width:100%;justify-content:center}
}
@media(min-width:761px){.water-card .water-buttons button{flex-basis:calc(12.5% - 8px)}}

/* ---------- scoring ---------- */
const moveMin=d=>d.workouts.reduce((a,w)=>a+(Number(w.min)||0),0);
function sleepHours(d){
  const {bed,wake}=d.sleep;if(!bed||!wake)return null;
  const [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);
  const m=((wh*60+wm)-(bh*60+bm)+1440)%1440;return m?m/60:null;
}
function compute(d){
  const g={},t={};
  const ap=TASKS.filter(([k])=>!(d.tasks[k]&&d.tasks[k].na));
  const done=ap.filter(([k])=>d.tasks[k]&&d.tasks[k].done).length;
  g.tasks=ap.length?done/ap.length:0;
  t.tasks=TASKS.some(([k])=>d.tasks[k]&&(d.tasks[k].done||d.tasks[k].na));
  const sd=d.study.filter(s=>s.done).length;g.study=Math.min(sd/GOALS.study,1);t.study=sd>0;
  const pv=PRAYERS.map(([k])=>d.prayers[k]||'');const pap=pv.filter(v=>v!=='na');const pw={ontime:1,late:.5,missed:0};
  g.prayer=pap.length?pap.reduce((a,v)=>a+(pw[v]||0),0)/pap.length:0;t.prayer=pv.some(v=>v!=='');
  g.water=Math.min(d.water.length/GOALS.water,1);t.water=d.water.length>0;
  const lm=['b','l','d'].filter(k=>String(d.meals[k]).trim()).length;g.food=lm/3;
  t.food=Object.values(d.meals).some(v=>String(v).trim())||d.kcal!==''||d.protein!=='';
  const mv=moveMin(d);g.move=Math.min(mv/GOALS.move,1);t.move=mv>0;
  const sh=sleepHours(d);g.sleep=sh==null?0:Math.min(sh/GOALS.sleep,1);t.sleep=sh!=null;
  const ks=Object.keys(g);
  return {g,t,score:ks.reduce((a,k)=>a+g[k],0)/ks.length,cov:ks.filter(k=>t[k]).length,total:ks.length,done,ap:ap.length,sd,mv,sh,cups:d.water.length,
    pOn:pv.filter(v=>v==='ontime').length};
}
const pct=x=>Math.round(x*100);
const hrs=h=>h==null?'—':(Math.round(h*10)/10).toString().replace(/\.0$/,'');

/* ---------- sound / fx ---------- */
function blip(f=660){
  if(!db.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(t+.26)}catch{}
}
function fx(k,on){pendingFx={k,on};blip(on?740:420)}
function applyFx(){
  if(!pendingFx)return;const {k,on}=pendingFx;pendingFx=null;
  const el=document.querySelector(`[data-k="${CSS.escape(k)}"]`);if(!el)return;
  const c=on?'fx-on':'fx-off';el.classList.add(c);setTimeout(()=>el.classList.remove(c),700);
}

/* ---------- month view ---------- */
function monthData(y,m){
  const n=new Date(y,m+1,0).getDate(),out=[];
  for(let i=1;i<=n;i++){const k=`${y}-${pad(m+1)}-${pad(i)}`,d=db.days[k],c=d?compute(d):null;out.push({k,i,d,c,has:!!c&&c.cov>0})}
  return out;
}

async function hashPin(p){
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('daftar:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch{}
  return 'b:'+btoa(unescape(encodeURIComponent('daftar:'+p)));
}

/* ---------- modal ---------- */
function ask({icon='heart',title,text='',confirm='موافق',cancel='إلغاء',input=null,area=null}){
  return new Promise(res=>{
    const prev=document.activeElement,host=document.createElement('div');host.className='modal-backdrop';
    host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">${I(icon,34)}<h2 id="mTitle">${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:''}
    ${input?`<label class="field-label" for="mInput">${esc(input.label)}<input id="mInput" type="${input.type||'text'}" ${input.inputmode?`inputmode="${input.inputmode}"`:''} autocomplete="off"></label>`:''}
    ${area?`<label class="field-label" for="mArea">${esc(area.label)}<textarea id="mArea" readonly rows="6" dir="ltr">${esc(area.value)}</textarea></label>`:''}
    <div>${cancel?`<button type="button" class="secondary" data-m="no">${cancel}</button>`:''}<button type="button" class="primary" data-m="yes">${confirm}</button></div></div>`;
    document.body.appendChild(host);
    const done=v=>{document.removeEventListener('keydown',kd,true);host.remove();try{prev&&prev.focus&&prev.focus()}catch{}res(v)};
    const val=()=>input?($('#mInput',host).value):true;
    const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(null)}else if(e.key==='Enter'&&input&&e.target.id==='mInput'){e.preventDefault();done(val())}};
    document.addEventListener('keydown',kd,true);
    host.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='yes'?val():null);else if(e.target===host)done(null)});
    const f=$('#mInput',host)||$('#mArea',host)||$('[data-m="yes"]',host);setTimeout(()=>{f.focus();if(area)f.select()},30);
  });
}

  const app=document.getElementById('app');

    app.innerHTML=`<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main><header class="topbar" id="topbar"></header><div class="content" id="content"></div></main></div>`;
  }
  const ae=document.activeElement,fk=ae&&ae.dataset&&ae.dataset.k,sy=window.scrollY;
  $('#sidebar').innerHTML=sidebarHTML();$('#topbar').innerHTML=topbarHTML();
  $('#content').innerHTML=(view==='day'?dayHTML():view==='month'?monthHTML():guideHTML())+`<footer>${I('heart',12)}دفتر يومياتي · بياناتك تبقى على جهازك</footer>`;
  if(fk){const n=document.querySelector(`[data-k="${CSS.escape(fk)}"]`);if(n){try{n.focus({preventScroll:true})}catch{}}}
  window.scrollTo(0,sy);
  if(needStrip&&view==='day'){needStrip=false;const c=$('.calendar-strip .current');if(c){const s=$('#strip');if(s)s.scrollLeft+=c.getBoundingClientRect().left-s.getBoundingClientRect().left-(s.clientWidth-c.clientWidth)/2}}

}
function live(){
  const d=getDay(cursor),c=compute(d);
  const ov=$('#overview');if(ov)ov.innerHTML=overviewHTML(d,c);
  const sh=$('#sleepH');if(sh){sh.textContent=hrs(c.sh);$('#sleepNote').textContent=c.sh==null?'أدخل الوقتين':c.sh>=GOALS.sleep?'وصلت للهدف':'الهدف '+GOALS.sleep+' ساعات أو أكثر'}
  const mt=$('#moveTotal');if(mt)mt.textContent='إجمالي الحركة: '+fmtMin(c.mv);
  $$('[data-dur]').forEach(el=>{const w=d.workouts.find(x=>x.id===el.dataset.dur);if(w)el.textContent=fmtMin(Number(w.min)||0)});
  const pb=$('#proteinBox');if(pb){const pg=Number(db.settings.proteinGoal)||80,pr=Number(d.protein)||0;pb.innerHTML=`<div><div><span>البروتين اليوم</span><span>${pr} من ${pg} جم</span></div><progress max="100" value="${Math.min(100,Math.round(pr/pg*100))}"></progress></div>`}
  const st=$$('#strip button.current')[0];if(st&&d.savedAt)st.classList.add('saved');

const clock=ms=>{const s=Math.floor(ms/1000);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
function tick(){
  const n=new Date(),el=$('#clock');
  if(el){let h=n.getHours();const ap=h>=12?'م':'ص';h=h%12||12;el.textContent=`${h}:${pad(n.getMinutes())}`;$('#ampm').textContent=ap;
    const left=Math.max(0,Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/60000));$('#left').textContent=`باقي ${Math.floor(left/60)} ساعة و${left%60} دقيقة على نهاية اليوم`}
  for(const id of Object.keys(timers)){const b=document.querySelector(`[data-timer="${id}"]`);if(b)b.textContent=clock(Date.now()-timers[id])}
}
setInterval(tick,1000);

  render();
}
function go(v){const t='#'+v;if(location.hash===t)route();else location.hash=t}
addEventListener('hashchange',route);
function setDay(k){cursor=k;needStrip=true}

/* ---------- export / import ---------- */
async function saveFile(filename,data,title){
  if(dl){try{await dl.save({filename,data});return}catch(e){if(e&&e.code==='declined')return}}
  await ask({icon:'down',title,text:'التنزيل المباشر غير متاح هنا. انسخ النص التالي واحفظه في ملف باسم '+filename,confirm:'تم',cancel:'',area:{label:filename,value:data}});
}
async function doExport(){
  const stamp=todayKey();
  await saveFile(`daftar-yawmiyati-${stamp}.json`,JSON.stringify({app:'daftar-yawmiyati',version:1,exportedAt:new Date().toISOString(),days:db.days,settings:{proteinGoal:db.settings.proteinGoal}},null,1),'نسخة احتياطية');
}
function doImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='none';
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{
      let j;try{j=JSON.parse(String(r.result))}catch{await ask({icon:'info',title:'ملف غير صالح',text:'تعذّرت قراءة الملف. اختر ملف نسخة احتياطية بصيغة JSON حمّلته من الدفتر.',confirm:'حسناً',cancel:''});return}
      const days=j&&j.days&&typeof j.days==='object'?Object.keys(j.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)):[];
      if(!days.length){await ask({icon:'info',title:'لا توجد أيام في الملف',text:'هذا الملف لا يحتوي على بيانات أيام قابلة للاسترجاع.',confirm:'حسناً',cancel:''});return}
      const clash=days.filter(k=>db.days[k]).length;
      const ok=await ask({icon:'up',title:`استرجاع ${days.length} يوماً؟`,text:clash?`${clash} من هذه الأيام موجودة عندك وسيُستبدل بها محتوى الملف. بقية أيامك تبقى كما هي.`:'ستُضاف هذه الأيام إلى دفترك. أيامك الحالية تبقى كما هي.',confirm:'استرجاع'});
      if(!ok)return;
      for(const k of days)db.days[k]=norm(j.days[k]);
      if(j.settings&&Number(j.settings.proteinGoal))db.settings.proteinGoal=Number(j.settings.proteinGoal);
      persist();render();
    };
    r.readAsText(f);
  });
  document.body.appendChild(inp);inp.click();setTimeout(()=>inp.remove(),60000);
}
async function doCsv(){
  const {y,m}=mcur,days=monthData(y,m).filter(x=>x.has);
  const rows=[['التاريخ','الإنجاز %','عادات منجزة','جلسات مذاكرة','صلوات في وقتها','أكواب ماء','سعرات','بروتين جم','دقائق حركة','ساعات نوم']];
  for(const x of days){const d=x.d,c=x.c;rows.push([x.k,pct(c.score),c.done,c.sd,c.pOn,c.cups,d.kcal,d.protein,Math.round(c.mv),c.sh==null?'':hrs(c.sh)])}
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  await saveFile(`yawmiyati-${y}-${pad(m+1)}.csv`,csv,'تصدير الشهر');
}

/* ---------- AI estimate ---------- */
async function estimate(){
  const d=ensureDay(cursor),lines=MEALS.filter(([k])=>String(d.meals[k]).trim()).map(([k,l])=>`${l}: ${String(d.meals[k]).trim()}`);
  if(!lines.length){aiMsg='اكتب وصف وجبة واحدة على الأقل ثم أعد المحاولة.';render();return}
  aiBusy=true;aiMsg='';render();
  const prompt=`قدّر السعرات الحرارية والبروتين بالجرام لكل وجبة مما كتبه المستخدم، بتقدير تقريبي معقول للكميات المعتادة في السعودية. تجاهل أي وجبة فارغة.\nالوجبات:\n${lines.join('\n')}\n\nأعد JSON فقط بهذا الشكل ودون أي نص آخر:\n{"items":[{"name":"اسم الوجبة","kcal":0,"protein":0}],"note":"جملة قصيرة عن حدود التقدير"}`;
  try{
    const r=await sampleFn.json(prompt,{modelTier:'quick'});
    const items=(r&&Array.isArray(r.items)?r.items:[]).map(x=>({name:String(x.name||'وجبة'),kcal:Math.max(0,Number(x.kcal)||0),protein:Math.max(0,Number(x.protein)||0)}));
    if(!items.length)throw {code:'empty'};
    d.est={items,kcal:items.reduce((a,x)=>a+x.kcal,0),protein:items.reduce((a,x)=>a+x.protein,0),note:r.note?String(r.note):'',sig:JSON.stringify(d.meals)};
    persist();aiMsg='';
  }catch(e){
    const c=e&&e.code;aiMsg=c==='not_granted'?'لم تتم الموافقة على استخدام Claude، يمكنك إدخال الأرقام يدوياً.':c==='rate_limited'?'الطلبات كثيرة الآن، حاول بعد قليل.':'تعذّر التقدير الآن. أدخل السعرات والبروتين يدوياً.';
  }
  aiBusy=false;render();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,k=b.dataset.k;
  const D=()=>ensureDay(cursor);
  switch(a){
    case 'go':go(b.dataset.v);return;
    case 'sound':db.settings.sound=!db.settings.sound;persist();pendingFx=null;render();blip(660);return;
    case 'today':setDay(todayKey());render();return;
    case 'strip':setDay(b.dataset.day);render();return;
    case 'dnav':{const dt=parseKey(cursor);dt.setDate(dt.getDate()+Number(b.dataset.n));setDay(key(dt));render();return}
    case 'tab':tab=b.dataset.t;render();return;
    case 'hideBanner':db.settings.hideBanner=true;persist();render();return;
    case 'task':{const d=D(),t=d.tasks[b.dataset.id]||(d.tasks[b.dataset.id]={});t.done=!t.done;if(t.done){t.na=false;t.at=new Date().toISOString()}else t.at=null;persist();fx(k,t.done);render();return}
    case 'na':{const d=D(),t=d.tasks[b.dataset.id]||(d.tasks[b.dataset.id]={});t.na=!t.na;if(t.na){t.done=false;t.at=null}persist();render();return}
    case 'alltasks':{const d=D(),ap=TASKS.filter(([id])=>!(d.tasks[id]&&d.tasks[id].na)),all=ap.length&&ap.every(([id])=>d.tasks[id]&&d.tasks[id].done);
      ap.forEach(([id])=>{const t=d.tasks[id]||(d.tasks[id]={});if(all){t.done=false;t.at=null}else if(!t.done){t.done=true;t.at=new Date().toISOString()}});persist();fx(k,!all);render();return}
    case 'study':{const s=D().study[Number(b.dataset.i)];s.done=!s.done;s.at=s.done?new Date().toISOString():null;persist();fx(k,s.done);render();return}
    case 'stype':{const s=D().study[Number(b.dataset.i)];s.type=s.type===b.dataset.t?'':b.dataset.t;persist();render();return}
    case 'cup':{const w=D().water,i=Number(b.dataset.i);let on;
      if(i===w.length){w.pop();on=false}else if(i<w.length){w.length=i;on=false}else{while(w.length<i)w.push(new Date().toISOString());on=true}
      persist();fx(k,on);render();return}
    case 'resetwater':D().water=[];persist();render();return;
    case 'wkadd':{D().workouts.push({id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',link:'',min:'',rounds:''});persist();render();return}
    case 'wkrm':{const d=D();d.workouts=d.workouts.filter(w=>w.id!==b.dataset.id);delete timers[b.dataset.id];persist();render();return}
    case 'wktimer':{const id=b.dataset.id,w=D().workouts.find(x=>x.id===id);if(!w)return;
      if(timers[id]==null){timers[id]=Date.now();blip(740)}else{const m=Math.max(1,Math.round((Date.now()-timers[id])/60000));w.min=(Number(w.min)||0)+m;delete timers[id];persist();blip(520)}
      render();return}
    case 'save':{const d=D();d.savedAt=new Date().toISOString();persist();fx(k,true);render();return}
    case 'clear':{const ok=await ask({icon:'trash',title:'مسح بيانات هذا اليوم؟',text:'سيُحذف كل ما سجّلته في هذا اليوم ولا يمكن التراجع. نصيحة: حمّل نسخة احتياطية أولاً إن لم تكن متأكداً.',confirm:'امسح اليوم'});
      if(ok){delete db.days[cursor];persist();render()}return}
    case 'est':estimate();return;
    case 'estapply':{const d=D();if(d.est){d.kcal=Math.round(d.est.kcal);d.protein=Math.round(d.est.protein);persist();render()}return}
    case 'mnav':{let m=mcur.m+Number(b.dataset.n),y=mcur.y;if(m<0){m=11;y--}if(m>11){m=0;y++}mcur={y,m};render();return}
    case 'mday':setDay(b.dataset.day);go('today');return;
    case 'mcsv':doCsv();return;
    case 'export':doExport();return;
    case 'import':doImport();return;
    case 'lock':locked=true;lockErr='';render();return;
    case 'pin':{
      if(db.settings.pin){
        const ok=await ask({icon:'lock',title:'رمز القفل',text:'اكتب رمزاً جديداً من 4 أرقام أو أكثر. اتركه فارغاً لإزالة القفل.',confirm:'حفظ',input:{label:'الرمز الجديد',type:'password',inputmode:'numeric'}});
        if(ok===null)return;const v=String(ok).trim();
        if(!v){db.settings.pin=null;persist();render();return}
        if(!/^\d{4,12}$/.test(v)){await ask({icon:'info',title:'رمز غير صالح',text:'استخدم من 4 إلى 12 رقماً.',confirm:'حسناً',cancel:''});return}
        db.settings.pin=await hashPin(v);persist();render();return;
      }
      const ok=await ask({icon:'lock',title:'قفل الدفتر بالرمز',text:'اختر رمزاً من 4 إلى 12 رقماً. سيُطلب كلما فتحت الصفحة. الرمز يخفي الدفتر فقط وليس تشفيراً للبيانات.',confirm:'تفعيل القفل',input:{label:'الرمز',type:'password',inputmode:'numeric'}});
      if(ok===null)return;const v=String(ok).trim();
      if(!/^\d{4,12}$/.test(v)){await ask({icon:'info',title:'رمز غير صالح',text:'استخدم من 4 إلى 12 رقماً.',confirm:'حسناً',cancel:''});return}
      db.settings.pin=await hashPin(v);persist();render();return;
    }
  }
});
function onField(el,type){
  const f=el.dataset.f;if(!f)return;
  const [a,b,c]=f.split(':');
  if(a==='pgoal'){db.settings.proteinGoal=Math.max(0,Number(el.value)||0);persist();live();return}
  if(isFuture(cursor))return;
  const d=ensureDay(cursor);
  const num=v=>v===''?'':Math.max(0,Number(v)||0);
  if(a==='meal')d.meals[b]=el.value;
  else if(a==='kcal')d.kcal=num(el.value);
  else if(a==='protein')d.protein=num(el.value);
  else if(a==='pray')d.prayers[b]=el.value;
  else if(a==='bed')d.sleep.bed=el.value;
  else if(a==='wake')d.sleep.wake=el.value;
  else if(a==='notes')d.notes=el.value;
  else if(a==='wk'){const w=d.workouts.find(x=>x.id===b);if(!w)return;
    if(c==='min'||c==='rounds')w[c]=num(el.value);else w[c]=el.value;
    if(c==='link'&&type==='change'){persist();render();return}}
  persist();live();
}
document.addEventListener('input',e=>onField(e.target,'input'));
document.addEventListener('change',e=>onField(e.target,'change'));
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lockForm')return;e.preventDefault();
  const v=$('#pinInput').value.trim(),h=await hashPin(v);
  if(h===db.settings.pin){locked=false;lockErr='';render()}else{lockErr='الرمز غير صحيح، حاول مرة أخرى.';render();const i=$('#pinInput');i&&i.focus()}
});
document.addEventListener('click',async e=>{
  if(e.target.id!=='forgot')return;
  const ok=await ask({icon:'trash',title:'مسح الدفتر بالكامل؟',text:'سيُحذف كل ما سجّلته على هذا الجهاز ويُزال القفل. لا يمكن التراجع إلا إن كانت عندك نسخة احتياطية.',confirm:'امسح كل شيء'});
  if(ok){db.days={};db.settings.pin=null;persist();locked=false;render()}
});

/* ---------- boot ---------- */
route();
(async()=>{
  try{sampleFn=await window.claude?.use?.('sample')}catch{}
  try{dl=await window.claude?.use?.('downloads')}catch{}
  if(sampleFn&&!locked&&view==='day'&&tab==='food')render();
})();
})();

</script>
